{% extends "base_auth.html" %}
{% block title %}Password Reset Complete{% endblock %}
{% block auth_content %}
<div class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900">&#x1F4CB; CLRT</h1>
      <p class="text-gray-500 mt-1">Client Lifecycle &amp; Revenue Tracker</p>
    </div>
    <div class="card p-8 text-center">
      <div class="w-14 h-14 rounded-2xl bg-green-100 flex items-center justify-center mx-auto mb-5">
        <svg class="w-7 h-7 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
      </div>
      <h2 class="text-xl font-bold text-gray-900 mb-2">Password updated!</h2>
      <p class="text-sm text-gray-500 mb-6">Your password has been set. You can now sign in with your new password.</p>
      <a href="{% url 'accounts:login' %}" class="btn-primary inline-flex">Go to login &rarr;</a>
    </div>
  </div>
</div>
{% endblock %}
