{% extends "base_auth.html" %}
{% block title %}Forgot Password{% endblock %}
{% block auth_content %}
<div class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900">&#x1F4CB; CLRT</h1>
      <p class="text-gray-500 mt-1">Client Lifecycle &amp; Revenue Tracker</p>
    </div>
    <div class="card p-8">
      <div class="mb-6">
        <h2 class="text-xl font-semibold text-gray-900">Reset your password</h2>
        <p class="text-sm text-gray-500 mt-1">Enter your email address and we'll send you a link to reset your password.</p>
      </div>
      <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email address</label>
          <input type="email" name="email" class="input" placeholder="you@example.com" autofocus required />
        </div>
        <button type="submit" class="btn-primary w-full py-2.5">Send reset link</button>
      </form>
      <p class="text-center text-sm text-gray-500 mt-5">
        <a href="{% url 'accounts:login' %}" class="text-indigo-600 hover:underline">&larr; Back to login</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
