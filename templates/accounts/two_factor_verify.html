{% extends "base.html" %}
{% block title %}Verify Identity{% endblock %}
{% block content %}

<div class="min-h-[60vh] flex items-center justify-center">
  <div class="w-full max-w-sm">

    <div class="card p-8 text-center">
      <div class="w-14 h-14 rounded-2xl bg-indigo-100 flex items-center justify-center mx-auto mb-5">
        <svg class="w-7 h-7 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>

      <h1 class="text-xl font-bold text-gray-900 mb-1">Two-factor authentication</h1>
      <p class="text-sm text-gray-500 mb-6">Open your authenticator app and enter the 6-digit code.</p>

      {% if error %}
      <div class="mb-4 px-4 py-2.5 rounded-lg bg-red-50 border border-red-200 text-sm text-red-700 text-left">
        {{ error }}
      </div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <input
          type="text"
          name="code"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="6"
          placeholder="000000"
          autofocus
          required
          class="input text-center text-2xl tracking-[0.5em] font-mono w-full mb-4"
          style="letter-spacing:0.4em;"
        >
        <button type="submit" class="btn-primary w-full py-2.5">Verify →</button>
      </form>

      <p class="text-xs text-gray-400 mt-5">
        Lost access to your authenticator?
        <a href="mailto:{{ request.user.email }}" class="text-indigo-600 hover:underline">Contact admin</a>
      </p>
    </div>

  </div>
</div>

{% endblock %}
