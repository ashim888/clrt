<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accepted – {{ quote.title }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full text-center space-y-4">
    <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto">
      <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
      </svg>
    </div>
    <h1 class="text-xl font-bold text-gray-800">Quotation Accepted</h1>
    <p class="text-gray-500 text-sm">
      Thank you, <strong class="text-gray-700">{{ quote.signature_name }}</strong>. Your acceptance has been recorded
      on {{ quote.signature_at|date:"N j, Y" }} at {{ quote.signature_at|date:"g:i a" }}.
    </p>
    <div class="bg-white border rounded-xl p-4 text-left text-sm space-y-2">
      <div class="flex justify-between"><span class="text-gray-500">Quotation</span><span class="font-medium text-gray-800">{{ quote.title }}</span></div>
      <div class="flex justify-between"><span class="text-gray-500">Reference</span><span class="font-mono text-gray-600">{{ quote.quote_number }}</span></div>
      <div class="flex justify-between"><span class="text-gray-500">Status</span><span class="text-green-600 font-medium">Accepted</span></div>
    </div>
    <p class="text-xs text-gray-400">You may close this page.</p>
  </div>
</body>
</html>
